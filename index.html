<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the tab bar sit under the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ziziphus Molecular Atlas</title>
    <meta
      name="description"
      content="A molecular structure library for compounds reported in the genus Ziziphus, with 3D conformers where available. Every entry is cross-checked against PubChem and carries the literature it came from."
    />

    <meta name="theme-color" content="#0a0c10" />
    <meta name="color-scheme" content="dark" />

    <!-- Installed to a home screen, this should open without browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ziziphus" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Scrapers do not resolve relative og:image paths; these must be absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ziziphus Molecular Atlas" />
    <meta property="og:title" content="Ziziphus Molecular Atlas" />
    <meta
      property="og:description"
      content="A molecular structure library for compounds reported in the genus Ziziphus, with 3D conformers where available. Cross-checked against PubChem."
    />
    <meta property="og:url" content="https://www.ziziphus.tech/" />
    <meta property="og:image" content="https://www.ziziphus.tech/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ziziphus Molecular Atlas - verified structures for compounds reported in Ziziphus"
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ziziphus Molecular Atlas" />
    <meta
      name="twitter:description"
      content="A molecular structure library for compounds reported in the genus Ziziphus, with 3D conformers where available."
    />
    <meta name="twitter:image" content="https://www.ziziphus.tech/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
